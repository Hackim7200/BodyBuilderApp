# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

type Routine @model {
  id: ID!
  name: String!
  description: String
  focus: String
  estimatedDurationMinutes: Int
}

type Exercise @model {
  id: ID!
  name: String!
  type: String!
  muscleGroup: String
  techniques: String
}

type RoutineExercise @model {
  id: ID!
  routineId: ID!
  exerciseId: ID!
  orderIndex: Int!
  targetSets: Int
  targetReps: String
  restSeconds: Int
}

type Circuit @model {
  id: ID!
  name: String!
  description: String
  rounds: Int
  stationDurationSeconds: Int
  # When true, play shuffles station order once per session; when false/null, uses list order.
  randomizeStationOrder: Boolean
}

type CircuitExercise @model {
  id: ID!
  circuitId: ID!
  exerciseId: ID!
  orderIndex: Int!
}

type WorkoutLog @model {
  id: ID!
  routineExerciseId: ID!
  date: AWSDateTime!
  notes: String
}

# Each workout log has many set entries (e.g. 4 sets → 4 SetEntry rows).
type SetEntry @model {
  id: ID!
  workoutLogId: ID!
  setNumber: Int!
  weight: Float
  reps: Int
  # weight × reps for this set when both are logged; null when incomplete.
  trainingLoad: Float
  durationSeconds: Int
  isCompleted: Boolean
}



