<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#c6c6c6",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "inverse-surface": "#2f3131",
                        "surface-tint": "#5e5e5e",
                        "primary": "#000000",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary": "#3a3c3c",
                        "primary-fixed": "#5e5e5e",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f3f3",
                        "on-tertiary-fixed-variant": "#e2e2e2",
                        "on-primary-fixed": "#ffffff",
                        "primary-container": "#3b3b3b",
                        "surface-container-high": "#e8e8e8",
                        "on-tertiary-container": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-fixed-dim": "#acabab",
                        "tertiary-fixed-dim": "#454747",
                        "tertiary-container": "#737575",
                        "surface": "#f9f9f9",
                        "on-secondary-container": "#1b1c1c",
                        "secondary-container": "#d5d4d4",
                        "on-primary-container": "#ffffff",
                        "on-error-container": "#410002",
                        "tertiary-fixed": "#5d5f5f",
                        "on-surface-variant": "#474747",
                        "on-background": "#1a1c1c",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#c7c6c6",
                        "on-secondary-fixed-variant": "#3b3b3c",
                        "on-tertiary-fixed": "#ffffff",
                        "inverse-primary": "#c6c6c6",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "outline": "#777777",
                        "on-primary": "#e2e2e2",
                        "primary-fixed-dim": "#474747",
                        "background": "#f9f9f9",
                        "on-tertiary": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "secondary": "#5e5e5e",
                        "surface-bright": "#f9f9f9",
                        "on-error": "#ffffff",
                        "surface-dim": "#dadada",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1a1c1c"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F9F9F9]/80 dark:bg-[#000000]/80 backdrop-blur-md flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-black dark:text-white hover:opacity-70 transition-opacity active:scale-95 duration-200">close</button>
<h1 class="font-['Inter'] font-extrabold tracking-tighter text-black dark:text-white text-xl uppercase">KINETIC ARCHIVE</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNVS73e3vrQM8xxE9OQFjLcN6mUQikPp6UrwmNVZ5MTFRKBtPV_jXDnBqm9LdIMqOIDe-U0hU4ZWDR8xkLPeFbjGbYLXl9728kw_giSxMXtah_BmDatdWdBfRmsN8ycjS9rXnQz2_MLzJybwkSlCeGJYrwBhnaOw288bBcWXc7BRnpF5oFwnI1-pSzZoHTcyJmR-SeyJDc1fZMaKSF9xqowgMnD097P3FDvvLJAsCW27XojCavLi3ZY0KobOuSVhT_SLK02HFeaiTJ"/>
</div>
</header>
<main class="min-h-screen pt-24 pb-32 px-6 flex flex-col items-center max-w-xl mx-auto">
<!-- Exercise Title Header -->
<div class="w-full mb-12 text-center">
<span class="font-label font-semibold uppercase tracking-[0.15em] text-[10px] text-tertiary block mb-2">CURRENT EXERCISE</span>
<h2 class="font-headline font-bold uppercase tracking-[0.05em] text-3xl">PLANK</h2>
</div>
<!-- Timer Section with Asymmetric Layout -->
<div class="relative w-full aspect-square flex items-center justify-center mb-12">
<!-- Progress Ring (SVG) -->
<svg class="absolute w-full h-full" viewbox="0 0 100 100">
<!-- Track -->
<circle class="text-surface-container-high stroke-current" cx="50" cy="50" fill="transparent" r="48" stroke-width="2"></circle>
<!-- Progress -->
<circle class="text-primary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="48" stroke-dasharray="301.59" stroke-dashoffset="100" stroke-linecap="square" stroke-width="2"></circle>
</svg>
<!-- Central Countdown Display -->
<div class="z-10 flex flex-col items-center">
<div class="font-headline font-extrabold text-[8rem] leading-none tracking-[-0.04em] text-primary">
                    01:42
                </div>
<div class="mt-4 flex items-center gap-2">
<span class="font-label font-semibold uppercase tracking-[0.1em] text-[12px] text-tertiary">PB: 02:00</span>
<span class="w-1 h-1 rounded-full bg-error animate-pulse"></span>
</div>
</div>
</div>
<!-- Control Cluster (Bento-style Grid) -->
<div class="grid grid-cols-3 gap-3 w-full mb-12">
<!-- Secondary Actions -->
<button class="bg-surface-container flex flex-col items-center justify-center py-6 rounded-sm hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined mb-2">refresh</span>
<span class="font-label font-semibold uppercase tracking-[0.1em] text-[10px]">RESET</span>
</button>
<!-- Primary Action -->
<button class="bg-primary bg-gradient-to-br from-primary to-primary-container text-on-primary flex flex-col items-center justify-center py-6 rounded-sm hover:opacity-90 transition-opacity active:scale-95">
<span class="material-symbols-outlined mb-2 text-3xl" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="font-label font-semibold uppercase tracking-[0.1em] text-[10px]">STOP</span>
</button>
<!-- Secondary Actions -->
<button class="bg-surface-container flex flex-col items-center justify-center py-6 rounded-sm hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined mb-2">save</span>
<span class="font-label font-semibold uppercase tracking-[0.1em] text-[10px]">COMPLETE</span>
</button>
</div>
<!-- Metric Archive (Editorial Style) -->
<div class="w-full grid grid-cols-2 gap-px bg-surface-container-highest overflow-hidden rounded-sm mb-12">
<div class="bg-surface p-4">
<p class="font-label font-semibold uppercase tracking-[0.1em] text-[10px] text-tertiary mb-1">PERCENTAGE CHANGE</p>
<p class="font-headline font-bold text-xl uppercase text-green-600">+2.5%</p>
</div>
<div class="bg-surface p-4">
<p class="font-label font-semibold uppercase tracking-[0.1em] text-[10px] text-tertiary mb-1">MAX TIME</p>
<p class="font-headline font-bold text-xl uppercase">02:15 <span class="text-xs font-normal">MIN</span></p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe z-50 bg-neutral-50/80 dark:bg-neutral-900/80 backdrop-blur-md border-t border-neutral-200/20 dark:border-neutral-800/20">
<a class="flex flex-col items-center justify-center text-black dark:text-white bg-neutral-200 dark:bg-neutral-800 rounded-lg px-4 py-1 transition-transform scale-98 active:scale-95" href="#">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-['Inter'] font-semibold uppercase tracking-[0.1em] text-[10px]">Workouts</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-600 px-4 py-1 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all scale-98 active:scale-95" href="#">
<span class="material-symbols-outlined">reorder</span>
<span class="font-['Inter'] font-semibold uppercase tracking-[0.1em] text-[10px]">Circuits</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-600 px-4 py-1 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all scale-98 active:scale-95" href="#">
<span class="material-symbols-outlined">self_improvement</span>
<span class="font-['Inter'] font-semibold uppercase tracking-[0.1em] text-[10px]">Stretch</span>
</a>
</nav>
</body></html>
